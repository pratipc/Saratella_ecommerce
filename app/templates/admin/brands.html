<!-- File: brands.html -->
<!-- Location: /app/templates/admin/ -->

{% extends "admin/admin_base.html" %}

{% block title %}Manage Brands - Saratella Admin{% endblock %}

{% block admin_content %}
<script>
    window.initialBrands = {{ brands | default([]) | tojson | safe }};

    function brandManagementLogic() {
        return {
            brands: window.initialBrands,
            searchQuery: '',
            
            isModalOpen: false,
            isSaving: false,
            formData: { name: '', description: '' },

            get filteredBrands() {
                if (!this.searchQuery) return this.brands;
                const q = this.searchQuery.toLowerCase();
                return this.brands.filter(b => b.name.toLowerCase().includes(q));
            },

            openModal() {
                this.formData = { name: '', description: '' };
                this.isModalOpen = true;
            },
            
            closeModal() {
                this.isModalOpen = false;
            },

            saveBrand() {
                if (!this.formData.name) return;
                this.isSaving = true;
                
                fetch("{{ url_for('admin.api_create_brand') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.formData)
                })
                .then(async res => {
                    const data = await res.json().catch(() => null);
                    if(!res.ok || (data && data.error)) throw new Error(data?.error || "Server Error");
                    
                    if(typeof showToast === 'function') showToast("Brand created successfully", "success");
                    
                    // Optimistic UI Update
                    this.brands.unshift({
                        brand_id: data.brand_id,
                        name: data.name,
                        description: this.formData.description,
                        product_count: 0
                    });
                    
                    this.closeModal();
                })
                .catch(err => {
                    if(typeof showToast === 'function') showToast(err.message, "error");
                })
                .finally(() => this.isSaving = false);
            }
        }
    }
</script>

<div x-data="brandManagementLogic()" class="max-w-7xl mx-auto pb-10 relative">
    
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Brands</h1>
            <p class="mt-2 text-sm text-gray-500">Manage manufacturers and verified suppliers.</p>
        </div>
        <button @click="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow-md flex items-center gap-2">
            <i class="fas fa-plus"></i> Add Brand
        </button>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col min-h-[500px]">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-900">All Brands</h2>
            <div class="relative w-64">
                <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                <input type="text" x-model="searchQuery" placeholder="Search brands..." class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
        </div>

        <div class="overflow-x-auto w-full flex-1">
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-white">
                    <tr>
                        <th class="px-6 py-4 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Brand Name</th>
                        <th class="px-6 py-4 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Description</th>
                        <th class="px-6 py-4 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider">Products Linked</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 bg-white">
                    <template x-for="brand in filteredBrands" :key="brand.brand_id">
                        <tr class="hover:bg-gray-50/80 transition-colors group">
                            <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-900" x-text="brand.name"></td>
                            <td class="px-6 py-4 text-gray-500 text-xs truncate max-w-xs" x-text="brand.description || 'No description'"></td>
                            <td class="px-6 py-4 text-center whitespace-nowrap">
                                <span class="bg-gray-100 text-gray-600 font-bold px-3 py-1 rounded-full text-xs" x-text="brand.product_count"></span>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredBrands.length === 0">
                        <td colspan="3" class="px-6 py-12 text-center text-gray-500">No brands found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Modal -->
    <div x-show="isModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center px-4" x-cloak>
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" @click="closeModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative z-10 p-6">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-gray-900">Add New Brand</h3>
                <button @click="closeModal()" class="text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
            </div>
            <form @submit.prevent="saveBrand">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
                        <input type="text" x-model="formData.name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Description</label>
                        <textarea x-model="formData.description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <button type="submit" :disabled="isSaving" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
                    <span x-show="!isSaving">Create Brand</span>
                    <span x-show="isSaving"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
