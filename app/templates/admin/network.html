<!-- File: network.html -->
<!-- Location: /app/templates/admin/ -->

{% extends "admin/admin_base.html" %}

{% block title %}Network Topology - Saratella Admin{% endblock %}

{% block admin_content %}
<script>
    // Inject the Python hierarchy structure
    window.initialHierarchy = {{ hierarchy | default([]) | tojson | safe }};

    function networkLogic() {
        return {
            hierarchy: window.initialHierarchy || [],
            
            // Modal States
            isModalOpen: false,
            modalType: '', // 'region', 'area', 'store'
            isEditing: false,
            isSaving: false,
            
            // Form Data Payload
            formData: {
                id: null,
                name: '',
                code: '', // Stores only
                region_id: null, // For creating Areas
                area_id: null    // For creating Stores
            },

            // Operations
            openModal(type, parentId = null, existingData = null) {
                this.modalType = type;
                this.isEditing = !!existingData;
                this.isSaving = false;
                
                this.formData = {
                    id: existingData ? existingData.id : null,
                    name: existingData ? existingData.name : '',
                    code: existingData ? (existingData.code || '') : '',
                    region_id: type === 'area' ? parentId : null,
                    area_id: type === 'store' ? parentId : null,
                    min_order_value: existingData && existingData.min_order_value !== undefined ? existingData.min_order_value : 0.00,
                    max_order_value: existingData && existingData.max_order_value !== undefined ? existingData.max_order_value : 999999.99,
                    approval_thresholds: existingData && existingData.approval_thresholds !== undefined ? existingData.approval_thresholds : 500.00
                };
                
                this.isModalOpen = true;
            },
            
            closeModal() {
                this.isModalOpen = false;
            },

            async saveData() {
                if (!this.formData.name) return;
                this.isSaving = true;
                
                let endpoint = `/admin/api/network/${this.modalType}`;
                let method = this.isEditing ? 'PUT' : 'POST';

                try {
                    const res = await fetch(endpoint, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.formData)
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Server error");
                    
                    if (typeof showToast === 'function') showToast("Saved successfully!", "success");
                    
                    // Reload page to reflect exact DB state easily
                    setTimeout(() => window.location.reload(), 600);
                    
                } catch(err) {
                    if (typeof showToast === 'function') showToast(err.message, "error");
                    this.isSaving = false;
                }
            }
        }
    }
</script>

<div class="max-w-5xl mx-auto" x-data="networkLogic()">
    
    <!-- Header -->
    <div class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Supply Chain Network</h1>
            <p class="mt-2 text-sm text-gray-500">Configure Regions, Areas, and Warehouse fulfillment nodes.</p>
        </div>
        <button @click="openModal('region')" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition flex items-center gap-2">
            <i class="fas fa-plus"></i> Add New Region
        </button>
    </div>

    <!-- Hierarchy Tree -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
        
        <template x-if="hierarchy.length === 0">
            <div class="text-center py-10 text-gray-500">No network data found. Add a region to start.</div>
        </template>

        <div class="space-y-4">
            <template x-for="region in hierarchy" :key="'r'+region.id">
                <!-- Region Node -->
                <div class="border border-gray-200 rounded-lg overflow-hidden" x-data="{ expanded: true }">
                    <!-- Region Header -->
                    <div class="bg-slate-50 border-b border-gray-200 px-4 py-3 flex items-center justify-between cursor-pointer" @click="expanded = !expanded">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-chevron-right text-gray-400 transition-transform duration-200" :class="expanded ? 'rotate-90' : ''"></i>
                            <i class="fas fa-globe-americas text-blue-500 text-lg"></i>
                            <h3 class="text-base font-bold text-gray-900" x-text="region.name"></h3>
                        </div>
                        <div class="flex gap-2">
                            <button @click.stop="openModal('region', null, region)" class="text-xs font-bold text-gray-500 hover:text-blue-600 px-2 py-1 rounded bg-white border border-gray-200 shadow-sm"><i class="fas fa-pen"></i> Edit</button>
                            <button @click.stop="openModal('area', region.id)" class="text-xs font-bold text-white hover:bg-blue-700 px-3 py-1 rounded bg-blue-600 shadow-sm"><i class="fas fa-plus"></i> Add Area</button>
                        </div>
                    </div>

                    <!-- Region Content (Areas) -->
                    <div x-show="expanded" x-collapse class="p-4 bg-white">
                        <template x-if="region.areas.length === 0">
                            <p class="text-xs text-gray-400 italic pl-8">No areas defined for this region.</p>
                        </template>

                        <div class="space-y-3 pl-8">
                            <template x-for="area in region.areas" :key="'a'+area.id">
                                <!-- Area Node -->
                                <div class="border border-gray-100 rounded-lg bg-gray-50/50 p-3" x-data="{ areaExpanded: true }">
                                    <div class="flex items-center justify-between mb-2 cursor-pointer" @click="areaExpanded = !areaExpanded">
                                        <div class="flex items-center gap-2">
                                            <i class="fas fa-map text-purple-500"></i>
                                            <h4 class="text-sm font-bold text-gray-800" x-text="area.name"></h4>
                                        </div>
                                        <div class="flex gap-2">
                                            <button @click.stop="openModal('area', region.id, area)" class="text-[10px] text-gray-500 hover:text-blue-600 uppercase tracking-wide font-bold"><i class="fas fa-pen"></i> Edit</button>
                                            <button @click.stop="openModal('store', area.id)" class="text-[10px] text-purple-600 hover:text-purple-800 uppercase tracking-wide font-bold"><i class="fas fa-plus"></i> Add Store/Warehouse</button>
                                        </div>
                                    </div>

                                    <!-- Area Content (Stores) -->
                                    <div x-show="areaExpanded" x-collapse class="pl-6 pt-2 space-y-2">
                                        <template x-if="area.stores.length === 0">
                                            <p class="text-[10px] text-gray-400 italic">No stores in this area.</p>
                                        </template>
                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <template x-for="store in area.stores" :key="'s'+store.id">
                                                <div class="bg-white border border-gray-200 rounded p-3 flex justify-between items-center shadow-sm hover:border-purple-300 transition cursor-pointer" @click.stop="openModal('store', area.id, store)">
                                                    <div>
                                                        <p class="text-xs font-bold text-gray-900" x-text="store.name"></p>
                                                        <p class="text-[9px] text-gray-400 font-mono mt-0.5" x-text="'Code: ' + (store.code || 'N/A')"></p>
                                                    </div>
                                                    <i class="fas fa-warehouse text-gray-300"></i>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Shared Add/Edit Modal -->
    <div x-show="isModalOpen" class="fixed inset-0 z-50 flex items-center justify-center px-4" x-cloak>
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" @click="closeModal()"></div>
        
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative z-10 overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-900 capitalize">
                    <span x-text="isEditing ? 'Edit' : 'Add'"></span> <span x-text="modalType"></span>
                </h3>
                <button @click="closeModal()" class="text-gray-400 hover:text-gray-700 transition w-8 h-8 flex items-center justify-center rounded-md hover:bg-gray-200">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Modal Form -->
            <form @submit.prevent="saveData" class="p-6">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 capitalize" x-text="modalType + ' Name'"></label>
                        <input type="text" x-model="formData.name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition placeholder-gray-400" placeholder="e.g. North America, NYC, Store #123">
                    </div>
                    
                    <div x-show="modalType === 'store'">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Store / Node Code</label>
                        <input type="text" x-model="formData.code" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition font-mono placeholder-gray-400" placeholder="e.g. NYC-01">
                        
                        <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Min Order ($)</label>
                                <input type="number" step="0.01" x-model="formData.min_order_value" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Max Order ($)</label>
                                <input type="number" step="0.01" x-model="formData.max_order_value" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">Approval Threshold ($)</label>
                                <input type="number" step="0.01" x-model="formData.approval_thresholds" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="submit" :disabled="isSaving" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-sm transition flex justify-center items-center gap-2">
                    <span x-show="!isSaving"><i class="fas fa-save mr-1"></i> Save <span class="capitalize" x-text="modalType"></span></span>
                    <span x-show="isSaving"><i class="fas fa-spinner fa-spin"></i> Saving...</span>
                </button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
