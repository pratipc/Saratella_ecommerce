<!-- File: register.html -->
<!-- Location: /app/templates/auth/ -->
{% extends 'base.html' %}

{% block title %}Register - Saratella Online{% endblock %}

{% block content %}
<!-- Professional Martin Brower Brand Background Override -->
<div class="fixed inset-0 bg-[#010d17] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#042546] via-[#010d17] to-[#010d17] z-0 pointer-events-none"></div>

<div class="relative w-full max-w-lg mx-auto z-10 my-auto py-4">
    <!-- Premium Dark Glassmorphism Card -->
    <div class="bg-white/10 backdrop-blur-xl py-6 px-6 shadow-[0_8px_32px_rgba(0,0,0,0.4)] rounded-2xl sm:px-10 border border-white/10">
        
        <!-- Header -->
        <div class="mb-5 text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Martin Brower" class="h-10 sm:h-12 mx-auto object-contain drop-shadow-md">
            
            <h2 class="mt-3 text-xl font-bold text-[#f8f6f0]">
                Create an Account
            </h2>
            <p class="mt-1 text-xs text-gray-300">
                Join the enterprise supply chain network.
            </p>
        </div>

        <form class="space-y-3" action="{{ url_for('auth.register') }}" method="POST">
            
            <!-- Name Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">First Name</label>
                    <input id="first_name" name="first_name" type="text" required
                           class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition">
                </div>
                <div>
                    <label for="last_name" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">Last Name</label>
                    <input id="last_name" name="last_name" type="text"
                           class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">Email Address</label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition">
            </div>

            <!-- Phone -->
            <div>
                <label for="phone" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">Phone Number (Optional)</label>
                <input id="phone" name="phone" type="tel"
                       class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required
                       class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition">
            </div>

            <!-- Submit Button -->
            <div class="pt-1">
                <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-lg text-sm font-bold text-[#010d17] bg-[#f8f6f0] hover:bg-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#010d17] focus:ring-[#f8f6f0] transition-all transform hover:-translate-y-0.5 uppercase tracking-wider">
                    Create Account
                </button>
            </div>
        </form>

        <!-- Footer Links -->
        <div class="mt-4 text-center text-sm border-t border-white/10 pt-4">
            <p class="text-gray-400">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="font-bold text-[#f8f6f0] hover:text-white hover:underline transition ml-1">
                    Sign in here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
