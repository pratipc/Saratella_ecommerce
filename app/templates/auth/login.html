<!-- File: login.html -->
<!-- Location: /app/templates/auth/ -->
{% extends 'base.html' %}

{% block title %}Login - Saratella Online{% endblock %}

{% block content %}
<!-- Professional Martin Brower Brand Background Override -->
<div class="fixed inset-0 bg-[#010d17] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#042546] via-[#010d17] to-[#010d17] z-0 pointer-events-none"></div>

<div class="relative w-full max-w-md mx-auto z-10 my-auto py-4">
    <!-- Premium Dark Glassmorphism Card -->
    <div class="bg-white/10 backdrop-blur-xl py-6 px-6 shadow-[0_8px_32px_rgba(0,0,0,0.4)] rounded-2xl sm:px-10 border border-white/10">
        
        <!-- Logo and Header -->
        <div class="mb-5 text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Martin Brower" class="h-10 sm:h-12 mx-auto object-contain drop-shadow-md">
            
            <h2 class="mt-3 text-xl font-bold text-[#f8f6f0]">
                Welcome Back
            </h2>
            <p class="mt-1 text-xs text-gray-300">
                Sign in to access the enterprise portal.
            </p>
        </div>

        <form class="space-y-4" action="{{ url_for('auth.login') }}" method="POST">
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px] mb-1">
                    Email address
                </label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition"
                       placeholder="you@example.com">
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-xs font-bold text-gray-200 tracking-wide uppercase text-[10px]">
                        Password
                    </label>
                    <a href="#" class="text-[10px] font-medium text-gray-400 hover:text-[#f8f6f0] hover:underline transition">
                        Forgot password?
                    </a>
                </div>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       class="appearance-none block w-full px-4 py-2 border-0 rounded-lg shadow-inner placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#f8f6f0] sm:text-sm bg-[#f8f6f0] text-[#010d17] font-medium transition"
                       placeholder="••••••••">
            </div>

            <!-- Submit Button (High Contrast Cream) -->
            <div class="pt-1">
                <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-lg text-sm font-bold text-[#010d17] bg-[#f8f6f0] hover:bg-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#010d17] focus:ring-[#f8f6f0] transition-all transform hover:-translate-y-0.5 uppercase tracking-wider">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Footer Links -->
        <div class="mt-5 text-center border-t border-white/10 pt-4">
            <p class="text-gray-400 text-xs">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="font-bold text-[#f8f6f0] hover:text-white hover:underline transition ml-1">
                    Register here
                </a>
            </p>
            <p class="mt-3 text-[9px] uppercase tracking-widest text-gray-500 font-bold">
                &copy; 2026 Martin Brower. All Rights Reserved.
            </p>
        </div>
    </div>
</div>
{% endblock %}
