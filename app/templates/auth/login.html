<!-- File: login.html -->
<!-- Location: /app/templates/auth/ -->
{% extends 'base.html' %}

{% block title %}Login - Saratella Online{% endblock %}

{% block content %}
<!-- Removed outer full-screen wrappers. Base.html handles alignment. -->
<div class="relative w-full max-w-md mx-auto z-10">
    <!-- Glassmorphism Card -->
    <div class="bg-white/20 backdrop-blur-xl py-8 px-4 shadow-2xl rounded-2xl sm:px-10 border border-white/20">
        
        <!-- Logo and Header -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-white tracking-wide">Saratella Online</h1>
            <h2 class="mt-4 text-2xl font-bold text-gray-100">
                Welcome Back
            </h2>
            <p class="mt-2 text-sm text-gray-300">
                Sign in to access your exclusive collection.
            </p>
        </div>

        <form class="space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-200">
                    Email address
                </label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" autocomplete="email" required
                           class="appearance-none block w-full px-4 py-3 border border-gray-400/50 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm bg-white/90 text-gray-900 transition"
                           placeholder="you@example.com">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-sm font-medium text-gray-200">
                        Password
                    </label>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-300 hover:text-blue-200 hover:underline">
                            Forgot password?
                        </a>
                    </div>
                </div>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           class="appearance-none block w-full px-4 py-3 border border-gray-400/50 rounded-lg shadow-sm placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm bg-white/90 text-gray-900 transition"
                           placeholder="••••••••">
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Footer Links -->
        <div class="mt-8 text-center text-sm">
            <p class="text-gray-300">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="font-bold text-white hover:text-blue-200 hover:underline transition">
                    Register here
                </a>
            </p>
            <p class="mt-6 text-xs text-gray-400">
                &copy; 2026 Saratella Online. All Rights Reserved.
            </p>
        </div>
    </div>
</div>
{% endblock %}
